<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Merriweather+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="Wrapper">

    <h2 >Weather App</h2>

    <div class="tab-container">

      <p class="tab" data-UserWeather>Your Weather</p>

      <p class="tab" data-searchWeather>Search Weather</p>
    </div>

      <div class="Weather-container">

        <!-- grant location container  -->
         <div class="grantAccessContainer">
        
          <img src="./Assest/location.png" alt="" width="80" height="80" loading="lazy">

          <p>Grant location access</p>

          <div>Allow Access to get weather Information</div>

          <button class="btn" data-grantAccess>Grant Access</button>
          
          

        </div>

        <!-- Search Weather  -->
         <form class="form-container" data-searchForm>
        <input  type="input" placeholder="Search City" autocomplete="off" class="input" data-searchInput>

          <button class="btn" type="submit">

            <img src="./Assest/search.png" alt="" width="20" height="20" loading="eager">

          </button>
          
         </form>
         <div class="Error-Image">
            <img src="./Assest/not-found.png" alt="">
         </div>

          <!-- Loading Screen Container-->
           <div class="sub-container loading-container">

            <img src="./Assest/loading.gif" alt="" width="150" height="150" loading="lazy">
            
            <p>Loading</p>

           </div>

          <!-- Show Weather Info -->

          <div class="sub-container user-Info-container">

            <div class="name">

              <p data-CityName></p>

              <img data-countryIcon>

            </div>

            <!-- Weather Description -->
            <p class="Weather-discription" data-WeatherDescription></p>
 
            <!-- Weather Icon -->
            <img class="WeatherIcon" data-WeatherIcon loading="lazy">

            <!-- Temprature -->
            <p class="DataTemprature" data-temperature></p>

            <!-- 3 Cards Parameter -->
            <p data-temp></p>

            

              <!-- parameter -->
               <div class="parameter-container">

                <!-- Card 1 -->
                 <div class="sub-container parameter">

                  <img src="./Assest/wind.png" alt="" >

                  <p>WindSpeed</p>

                  <p data-WindSpeed></p>

                 </div>
                 <!-- Card 2 -->
                 <div class="sub-container parameter">

                  <img src="./Assest/humidity.png" alt="" >

                  <p>Humidity</p>

                  <p data-Humidity></p>

                 </div>

                 <!-- Card 3 -->
                 <div class="sub-container parameter">

                  <img src="./Assest/cloud.png" alt="" >

                  <p>Clouds</p>

                  <p data-CloudNess></p>

                 </div>


               </div>

            </div>

          </div>

         

      </div>
      
    

  </div>
  <script src="script.js"></script>
  
</body>
</html>
